<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Mission Control: real-time fleet UI for AEP agent sessions (live lanes, an attention inbox with tap-to-respond, causal graphs)."
    />
    <title>AEP Mission Control</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%2371717a' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='6.5' fill='none' stroke='%2371717a' stroke-width='2.5' opacity='.55'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%2371717a'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      try {
        const t = localStorage.getItem('aep-mc:theme');
        const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      } catch {
        /* default: light */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
